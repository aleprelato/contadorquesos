<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contador Rápido</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* Configuración base para evitar scroll y zoom por doble toque en móviles */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #121214;
            color: #f4f4f5;
        }

        /* Colores específicos solicitados */
        .btn-c {
            background-color: #FEF08A; /* Amarillo claro */
            color: #422006;
            border-bottom: 5px solid #FACC15;
        }
        .btn-ce {
            background-color: #CA8A04; /* Amarillo oscuro */
            color: #FFFFFF;
            border-bottom: 5px solid #854D0E;
        }
        .btn-p {
            background-color: #F5F2EB; /* Beige claro */
            color: #3E362E;
            border-bottom: 5px solid #D6CFC2;
        }
        .btn-pe {
            background-color: #B59E7A; /* Beige oscuro */
            color: #1F1912;
            border-bottom: 5px solid #8A7350;
        }
        .btn-h {
            /* Mezcla de amarillo y beige */
            background: linear-gradient(135deg, #FDE047 0%, #E6CCB2 50%, #B59E7A 100%);
            color: #292014;
            border-bottom: 5px solid #9C8253;
        }

        /* Efecto táctil al presionar */
        .counter-btn {
            transition: transform 0.06s cubic-bezier(0.4, 0, 0.2, 1), filter 0.06s ease;
        }
        .counter-btn:active {
            transform: translateY(3px) scale(0.97);
            filter: brightness(0.93);
        }

        /* Animación de pulso para el número cuando incrementa */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.22); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.14s ease-out;
        }
    </style>
</head>
<body class="flex flex-col justify-between p-3 sm:p-5 max-w-md mx-auto">

    <!-- Barra Superior: Totalizador discreto y Botón Pequeño de Reinicio -->
    <header class="flex items-center justify-between px-1 py-1 shrink-0">
        <div class="flex items-center space-x-2">
            <span class="text-xs font-bold uppercase tracking-wider text-zinc-400">Total:</span>
            <span id="total-count" class="text-sm font-black text-zinc-200 bg-zinc-800 px-2.5 py-0.5 rounded-full">0</span>
        </div>

        <!-- Botón extra pequeño para reiniciar contadores -->
        <button id="reset-btn" 
                onclick="resetAllCounters()" 
                aria-label="Reiniciar todos los contadores"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 active:bg-red-900/60 active:scale-95 text-zinc-300 text-xs font-semibold border border-zinc-700 transition-all shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
            <span>Reiniciar</span>
        </button>
    </header>

    <!-- Grilla Principal de Contadores y Botones (Sin Scroll, ocupa el alto restante) -->
    <main class="flex-1 grid grid-cols-2 grid-rows-3 gap-3 my-1 min-h-0">
        
        <!-- 1. Botón C (Amarillo Claro) -->
        <div class="flex flex-col bg-zinc-900/90 border border-zinc-800 rounded-2xl p-2 shadow-lg min-h-0">
            <!-- Contador arriba del botón -->
            <div class="flex flex-col items-center justify-center py-1 shrink-0">
                <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Contador</span>
                <span id="count-C" class="text-3xl sm:text-4xl font-black text-yellow-200 leading-tight">0</span>
            </div>
            <!-- Botón C -->
            <button onclick="incrementCounter('C')" 
                    class="counter-btn btn-c flex-1 w-full rounded-xl flex items-center justify-center shadow-md mt-1 min-h-0">
                <span class="text-4xl sm:text-5xl font-black tracking-tight">C</span>
            </button>
        </div>

        <!-- 2. Botón CE (Amarillo Oscuro) -->
        <div class="flex flex-col bg-zinc-900/90 border border-zinc-800 rounded-2xl p-2 shadow-lg min-h-0">
            <!-- Contador arriba del botón -->
            <div class="flex flex-col items-center justify-center py-1 shrink-0">
                <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Contador</span>
                <span id="count-CE" class="text-3xl sm:text-4xl font-black text-yellow-500 leading-tight">0</span>
            </div>
            <!-- Botón CE -->
            <button onclick="incrementCounter('CE')" 
                    class="counter-btn btn-ce flex-1 w-full rounded-xl flex items-center justify-center shadow-md mt-1 min-h-0">
                <span class="text-4xl sm:text-5xl font-black tracking-tight">CE</span>
            </button>
        </div>

        <!-- 3. Botón P (Beige Claro) -->
        <div class="flex flex-col bg-zinc-900/90 border border-zinc-800 rounded-2xl p-2 shadow-lg min-h-0">
            <!-- Contador arriba del botón -->
            <div class="flex flex-col items-center justify-center py-1 shrink-0">
                <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Contador</span>
                <span id="count-P" class="text-3xl sm:text-4xl font-black text-[#F5F2EB] leading-tight">0</span>
            </div>
            <!-- Botón P -->
            <button onclick="incrementCounter('P')" 
                    class="counter-btn btn-p flex-1 w-full rounded-xl flex items-center justify-center shadow-md mt-1 min-h-0">
                <span class="text-4xl sm:text-5xl font-black tracking-tight">P</span>
            </button>
        </div>

        <!-- 4. Botón PE (Beige Oscuro) -->
        <div class="flex flex-col bg-zinc-900/90 border border-zinc-800 rounded-2xl p-2 shadow-lg min-h-0">
            <!-- Contador arriba del botón -->
            <div class="flex flex-col items-center justify-center py-1 shrink-0">
                <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Contador</span>
                <span id="count-PE" class="text-3xl sm:text-4xl font-black text-[#D5C3AA] leading-tight">0</span>
            </div>
            <!-- Botón PE -->
            <button onclick="incrementCounter('PE')" 
                    class="counter-btn btn-pe flex-1 w-full rounded-xl flex items-center justify-center shadow-md mt-1 min-h-0">
                <span class="text-4xl sm:text-5xl font-black tracking-tight">PE</span>
            </button>
        </div>

        <!-- 5. Botón H (Mezcla Amarillo y Beige - Ocupa el ancho inferior para fácil acceso) -->
        <div class="col-span-2 flex flex-col bg-zinc-900/90 border border-zinc-800 rounded-2xl p-2 shadow-lg min-h-0">
            <!-- Contador arriba del botón -->
            <div class="flex flex-col items-center justify-center py-0.5 shrink-0">
                <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Contador</span>
                <span id="count-H" class="text-3xl sm:text-4xl font-black text-amber-200 leading-tight">0</span>
            </div>
            <!-- Botón H -->
            <button onclick="incrementCounter('H')" 
                    class="counter-btn btn-h flex-1 w-full rounded-xl flex items-center justify-center shadow-md mt-1 min-h-0">
                <span class="text-4xl sm:text-5xl font-black tracking-tight">H</span>
            </button>
        </div>

    </main>

    <script>
        // Estado inicial de todos los contadores
        const counts = {
            C: 0,
            CE: 0,
            P: 0,
            PE: 0,
            H: 0
        };

        /**
         * Incrementa el contador correspondiente en 1 y actualiza la pantalla
         * @param {string} key - Identificador del botón ('C', 'CE', 'P', 'PE', 'H')
         */
        function incrementCounter(key) {
            if (counts.hasOwnProperty(key)) {
                counts[key] += 1;
                updateDisplay(key, true);
                
                // Vibración táctil sutil en dispositivos móviles compatibles
                if (navigator.vibrate) {
                    navigator.vibrate(15);
                }
            }
        }

        /**
         * Reinicia todos los contadores a 0
         */
        function resetAllCounters() {
            Object.keys(counts).forEach(key => {
                counts[key] = 0;
                updateDisplay(key, false);
            });

            // Animación visual en el contador total al reiniciar
            const totalEl = document.getElementById('total-count');
            triggerPopAnimation(totalEl);

            if (navigator.vibrate) {
                navigator.vibrate([20, 40, 20]);
            }
        }

        /**
         * Actualiza el número en el DOM y recalcula el total
         */
        function updateDisplay(key, animate) {
            const countElement = document.getElementById(`count-${key}`);
            if (countElement) {
                countElement.textContent = counts[key];
                if (animate) {
                    triggerPopAnimation(countElement);
                }
            }

            // Actualizar suma total en la barra superior
            const total = Object.values(counts).reduce((acc, val) => acc + val, 0);
            const totalElement = document.getElementById('total-count');
            if (totalElement) {
                totalElement.textContent = total;
            }
        }

        /**
         * Aplica una breve animación de escala al número actualizado
         */
        function triggerPopAnimation(element) {
            element.classList.remove('animate-pop');
            // Forzar reflow para reiniciar la animación en toques rápidos
            void element.offsetWidth;
            element.classList.add('animate-pop');
        }
    </script>
</body>
</html>
